<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLC Business Cloud V0.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#18181b', background: '#fafafa', surface: '#ffffff', text: '#09090b', muted: '#71717a', border: '#e4e4e7', accent: '#3b82f6' } } } }
    </script>
</head>
<body class="bg-background text-text font-sans">
    <div id="app">
        <header class="border-b border-border bg-surface sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <h1 class="font-bold text-xl">WLC<span class="text-muted font-normal">.Cloud</span></h1>
                <nav class="flex gap-6">
                    <button onclick="App.router.push('dashboard')" class="text-sm font-medium hover:text-accent">Dashboard</button>
                    <button onclick="App.router.push('products')" class="text-sm font-medium hover:text-accent">Produtos</button>
                    <button onclick="App.router.push('pos')" class="text-sm font-medium hover:text-accent">PDV</button>
                </nav>
            </div>
        </header>
        <main class="max-w-7xl mx-auto px-4 py-8" id="content">
            <div class="space-y-4">
                <h2 class="text-3xl font-bold">Bem-vindo ao WLC Business Cloud</h2>
                <p class="text-muted">Sistema comercial profissional.</p>
            </div>
        </main>
    </div>
    <script>
        // --- CORE: WLC.DB ---
        const wlcDb = {
            data: JSON.parse(localStorage.getItem('wlc_db') || '{}'),
            collection: (name) => {
                if (!wlcDb.data[name]) wlcDb.data[name] = [];
                return {
                    list: () => [...wlcDb.data[name]],
                    create: (item) => {
                        const entry = { ...item, id: Date.now(), createdAt: new Date().toISOString() };
                        wlcDb.data[name].push(entry);
                        localStorage.setItem('wlc_db', JSON.stringify(wlcDb.data));
                        return entry;
                    }
                };
            }
        };

        // --- CORE: SERVICES ---
        const ProductService = {
            list: () => wlcDb.collection('produtos').list(),
            create: (name, price) => wlcDb.collection('produtos').create({ name, price: parseFloat(price) })
        };

        // --- CORE: APP ---
        const App = {
            router: {
                push: (page) => {
                    const content = document.getElementById('content');
                    content.innerHTML = App.render[page] ? App.render[page]() : '<p>Página não encontrada.</p>';
                }
            },
            render: {
                dashboard: () => `<h2 class="text-2xl font-bold">Dashboard</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4"><div class="p-6 bg-surface border border-border rounded-md">Total Produtos: ${ProductService.list().length}</div></div>`,
                products: () => `
                    <h2 class="text-2xl font-bold mb-4">Gestão de Produtos</h2>
                    <div class="flex gap-2 mb-4">
                        <input id="prodName" placeholder="Nome" class="border p-2 rounded">
                        <input id="prodPrice" type="number" placeholder="Preço" class="border p-2 rounded">
                        <button onclick="App.actions.addProduct()" class="bg-primary text-white px-4 py-2 rounded">Salvar</button>
                    </div>
                    <div class="border rounded-md overflow-hidden bg-surface">
                        ${ProductService.list().map(p => `<div class="p-4 border-b last:border-b-0">${p.name} - R$ ${p.price.toFixed(2)}</div>`).join('')}
                    </div>
                `,
                pos: () => `<h2 class="text-2xl font-bold">PDV - Em desenvolvimento</h2>`
            },
            actions: {
                addProduct: () => {
                    const name = document.getElementById('prodName').value;
                    const price = document.getElementById('prodPrice').value;
                    if(name && price) {
                        ProductService.create(name, price);
                        App.router.push('products');
                    }
                }
            }
        };
    </script>
</body>
</html>
