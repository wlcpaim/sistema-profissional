<!DOCTYPE html>
<html lang=\"pt-BR\">
<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <title>WLC SaaS | Dashboard</title>
    <script src=\"https://cdn.tailwindcss.com\"></script>
    <script src=\"https://unpkg.com/lucide@latest\"></script>
    <link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#00FFCC',
                        slate: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155', 50: '#f8fafc', 100: '#f1f5f9' },
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class=\"bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans transition-colors duration-300\">

    <div class=\"flex h-screen overflow-hidden\">
        <aside class=\"w-64 bg-slate-900 text-white flex flex-col\">
            <div class=\"p-6 flex items-center justify-between\">
                <div class=\"flex items-center gap-3\">
                    <div class=\"w-8 h-8 rounded-lg bg-primary flex items-center justify-center\">
                        <i data-lucide=\"zap\" class=\"w-5 h-5 text-slate-900\"></i>
                    </div>
                    <span class=\"text-xl font-bold tracking-tight\">WLC SaaS</span>
                </div>
            </div>
            <nav class=\"flex-1 px-4 py-4 space-y-1\">
                <button onclick=\"App.router.push('dashboard')\" class=\"w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white\">
                    <i data-lucide=\"layout-dashboard\" class=\"w-5 h-5\"></i> Dashboard
                </button>
                <button onclick=\"App.router.push('products')\" class=\"w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white\">
                    <i data-lucide=\"package\" class=\"w-5 h-5\"></i> Produtos
                </button>
                <button onclick=\"App.router.push('pos')\" class=\"w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white\">
                    <i data-lucide=\"shopping-bag\" class=\"w-5 h-5\"></i> PDV Pro
                </button>
                <button onclick=\"App.router.push('settings')\" class=\"w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white\">
                    <i data-lucide=\"settings\" class=\"w-5 h-5\"></i> Configurações
                </button>
            </nav>
            <div class=\"p-4 border-t border-slate-800\">
                <button onclick=\"document.documentElement.classList.toggle('dark')\" class=\"w-full flex items-center gap-3 p-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white\">
                    <i data-lucide=\"moon\" class=\"w-5 h-5\"></i> Alternar Tema
                </button>
            </div>
        </aside>

        <main class=\"flex-1 flex flex-col overflow-hidden\">
            <header class=\"bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 h-16 flex items-center justify-between px-8\">
                <h2 id=\"pageTitle\" class=\"text-lg font-semibold capitalize\">Dashboard</h2>
                <div class=\"w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800\"></div>
            </header>

            <div id=\"content\" class=\"flex-1 overflow-auto p-8\">
            </div>
        </main>
    </div>

    <script>
        const wlcDb = {
            data: JSON.parse(localStorage.getItem('wlc_db') || '{"produtos": [], "vendas": [], "profile": {"name": "Minha Empresa", "email": "contato@empresa.com"}}'),
            save: () => localStorage.setItem('wlc_db', JSON.stringify(wlcDb.data)),
            collection: (name) => ({
                list: () => [...wlcDb.data[name]],
                create: (item) => {
                    const entry = { ...item, id: Date.now(), createdAt: new Date().toISOString() };
                    wlcDb.data[name].push(entry);
                    wlcDb.save();
                    return entry;
                }
            })
        };

        const ProductService = {
            list: () => wlcDb.collection('produtos').list(),
            create: (name, price) => wlcDb.collection('produtos').create({ name, price: parseFloat(price) })
        };

        const SalesService = {
            create: (items, total) => wlcDb.collection('vendas').create({ items, total })
        };

        const App = {
            state: { cart: [] },
            router: {
                push: (page) => {
                    document.getElementById('pageTitle').innerText = page.replace('-', ' ');
                    document.getElementById('content').innerHTML = App.render[page] ? App.render[page]() : '<p>Página não encontrada.</p>';
                    lucide.createIcons();
                }
            },
            render: {
                dashboard: () => {
                    const totalSales = wlcDb.data.vendas.length;
                    const totalRevenue = wlcDb.data.vendas.reduce((s, v) => s + v.total, 0);
                    return `
                        <div class=\"flex justify-between items-end mb-8\">\n                            <div>\n                                <h1 class=\"text-2xl font-bold\">Dashboard</h1>\n                                <p class=\"text-slate-500\">Visão geral de ${wlcDb.data.profile.name}</p>\n                            </div>\n                            <button onclick=\"App.actions.exportSales()\" class=\"flex items-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition\">\n                                <i data-lucide=\"download\" class=\"w-4 h-4\"></i> Exportar CSV\n                            </button>\n                        </div>\n                        <div class=\"grid grid-cols-1 md:grid-cols-3 gap-6 mb-8\">\n                            <div class=\"bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm\">\n                                <p class=\"text-slate-500 text-sm\">Total Produtos</p>\n                                <p class=\"text-3xl font-bold mt-1\">${ProductService.list().length}</p>\n                            </div>\n                            <div class=\"bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm\">\n                                <p class=\"text-slate-500 text-sm\">Total Vendas</p>\n                                <p class=\"text-3xl font-bold mt-1\">${totalSales}</p>\n                            </div>\n                            <div class=\"bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm\">\n                                <p class=\"text-slate-500 text-sm\">Receita Total</p>\n                                <p class=\"text-3xl font-bold mt-1 text-primary\">R$ ${totalRevenue.toFixed(2)}</p>\n                            </div>\n                        </div>\n                        <div class=\"bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden\">\n                            <div class=\"p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center\">\n                                <h3 class=\"font-bold text-lg\">Histórico de Vendas</h3>\n                                <input type=\"text\" placeholder=\"Filtrar...\" oninput=\"App.actions.filterSales(this.value)\" class=\"bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none\">\n                            </div>\n                            <table class=\"w-full text-sm\">\n                                <thead class=\"bg-slate-50 dark:bg-slate-800 text-slate-500 uppercase\">\n                                    <tr>\n                                        <th class=\"px-6 py-3 text-left\">Data</th>\n                                        <th class=\"px-6 py-3 text-left\">Itens</th>\n                                        <th class=\"px-6 py-3 text-right\">Total</th>\n                                    </tr>\n                                </thead>\n                                <tbody class=\"divide-y divide-slate-100 dark:divide-slate-800\">\n                                    ${wlcDb.data.vendas.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(v => `\n                                        <tr class=\"sale-row\">\n                                            <td class=\"px-6 py-4\">${new Date(v.createdAt).toLocaleDateString()}</td>\n                                            <td class=\"px-6 py-4\">${v.items.length} itens</td>\n                                            <td class=\"px-6 py-4 text-right font-bold text-primary\">R$ ${v.total.toFixed(2)}</td>\n                                        </tr>\n                                    `).join('')}\n                                </tbody>\n                            </table>\n                        </div>\n                    `;\n                },\n                products: () => `\n                    <div class=\"bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden\">\n                        <div class=\"p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center\">\n                            <h3 class=\"font-bold text-lg\">Catálogo de Produtos</h3>\n                            <div class=\"flex gap-2\">\n                                <input id=\"prodName\" placeholder=\"Nome\" class=\"bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none\">\n                                <input id=\"prodPrice\" type=\"number\" placeholder=\"R$\" class=\"bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm w-20 focus:border-primary outline-none\">\n                                <button onclick=\"App.actions.addProduct()\" class=\"bg-slate-900 dark:bg-primary dark:text-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:opacity-90 transition\">Add</button>\n                            </div>\n                        </div>\n                        <div class=\"divide-y divide-slate-100 dark:divide-slate-800\">\n                            ${ProductService.list().map(p => `\n                                <div class=\"flex justify-between items-center py-4 px-6 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors\">\n                                    <span class=\"font-medium\">${p.name}</span>\n                                    <span class=\"text-primary font-bold text-sm bg-primary/10 px-3 py-1 rounded-full\">R$ ${p.price.toFixed(2)}</span>\n                                </div>\n                            `).join('')}\n                        </div>\n                    </div>\n                `,\n                pos: () => `\n                    <div class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n                        <div class=\"lg:col-span-2 space-y-4\">\n                            <div class=\"bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm\">\n                                <h3 class=\"font-bold text-lg mb-4\">Catálogo</h3>\n                                <div class=\"grid grid-cols-2 md:grid-cols-3 gap-3\">\n                                    ${ProductService.list().map(p => `\n                                        <button onclick=\"App.actions.addToCart(${p.id})\" class=\"p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-primary dark:hover:border-primary hover:bg-primary/5 transition-all\">\n                                            <p class=\"font-medium\">${p.name}</p>\n                                            <p class=\"text-primary font-bold text-sm\">R$ ${p.price.toFixed(2)}</p>\n                                        </button>\n                                    `).join('')}\n                                </div>\n                            </div>\n                        </div>\n                        <div class=\"bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm h-fit\">\n                            <h3 class=\"font-bold text-lg mb-4\">Checkout</h3>\n                            <div class=\"space-y-3 mb-6 max-h-64 overflow-auto\">\n                                ${App.state.cart.map(item => `\n                                    <div class=\"flex justify-between text-sm\">\n                                        <span>${item.name}</span>\n                                        <span class=\"font-semibold\">R$ ${item.price.toFixed(2)}</span>\n                                    </div>\n                                `).join('')}\n                            </div>\n                            <div class=\"border-t border-slate-100 dark:border-slate-800 pt-4 flex justify-between font-bold text-xl\">\n                                <span>Total</span>\n                                <span class=\"text-primary\">R$ ${App.state.cart.reduce((sum, item) => sum + item.price, 0).toFixed(2)}</span>\n                            </div>\n                            <button onclick=\"App.actions.checkout()\" class=\"w-full mt-6 bg-primary text-slate-900 font-bold py-3 rounded-xl hover:opacity-90 transition shadow-lg\">Finalizar Venda</button>\n                        </div>\n                    </div>\n                `,\n                settings: () => `\n                    <div class=\"bg-white dark:bg-slate-900 p-8 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm max-w-md\">\n                        <h3 class=\"font-bold text-xl mb-6\">Perfil da Empresa</h3>\n                        <div class=\"space-y-4\">\n                            <div>\n                                <label class=\"block text-sm font-medium mb-1\">Nome da Empresa</label>\n                                <input id=\"profileName\" value=\"${wlcDb.data.profile.name}\" class=\"w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 focus:border-primary outline-none\">\n                            </div>\n                            <div>\n                                <label class=\"block text-sm font-medium mb-1\">E-mail de Contato</label>\n                                <input id=\"profileEmail\" value=\"${wlcDb.data.profile.email}\" class=\"w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 focus:border-primary outline-none\">\n                            </div>\n                            <button onclick=\"App.actions.saveProfile()\" class=\"w-full bg-slate-900 dark:bg-primary dark:text-slate-900 text-white py-2 rounded-lg font-medium hover:opacity-90 transition\">Salvar Configurações</button>\n                        </div>\n                    </div>\n                `\n            },\n            actions: {\n                addProduct: () => {\n                    const name = document.getElementById('prodName').value;\n                    const price = document.getElementById('prodPrice').value;\n                    if(name && price) { ProductService.create(name, price); App.router.push('products'); }\n                },\n                addToCart: (id) => {\n                    const prod = ProductService.list().find(p => p.id === id);\n                    if(prod) { App.state.cart.push(prod); App.router.push('pos'); }\n                },\n                checkout: () => {\n                    const total = App.state.cart.reduce((sum, item) => sum + item.price, 0);\n                    if (total > 0) { SalesService.create([...App.state.cart], total); App.state.cart = []; App.router.push('dashboard'); }\n                },\n                filterSales: (query) => {\n                    document.querySelectorAll('.sale-row').forEach(r => r.style.display = r.innerText.toLowerCase().includes(query.toLowerCase()) ? '' : 'none');\n                },\n                exportSales: () => {\n                    const csv = 'Data,Itens,Total\\n' + wlcDb.data.vendas.map(v => `${new Date(v.createdAt).toLocaleDateString()},${v.items.length},${v.total.toFixed(2)}`).join('\\n');\n                    const a = document.createElement('a'); a.href = 'data:text/csv,' + encodeURIComponent(csv); a.download = 'vendas.csv'; a.click();\n                },\n                saveProfile: () => {\n                    wlcDb.data.profile.name = document.getElementById('profileName').value;\n                    wlcDb.data.profile.email = document.getElementById('profileEmail').value;\n                    wlcDb.save();\n                    alert('Configurações salvas com sucesso!');\n                    App.router.push('settings');\n                }\n            }\n        };\n\n        App.router.push('dashboard');\n    </script>\n</body>\n</html>", commit_message:
