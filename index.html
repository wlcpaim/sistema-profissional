<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLC SaaS | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#00FFCC',
                        slate: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155', 50: '#f8fafc', 100: '#f1f5f9' },
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .toast { transition: all 0.3s ease; transform: translateY(100%); }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans transition-colors duration-300">

    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-primary text-slate-900 px-6 py-3 rounded-lg font-bold shadow-lg toast hidden"></div>

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-6 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center">
                        <i data-lucide="zap" class="w-5 h-5 text-slate-900"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight">WLC SaaS</span>
                </div>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-1">
                <button onclick="App.router.push('dashboard')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </button>
                <button onclick="App.router.push('products')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                    <i data-lucide="package" class="w-5 h-5"></i> Produtos
                </button>
                <button onclick="App.router.push('pos')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i> PDV Pro
                </button>
                <button onclick="App.router.push('settings')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                    <i data-lucide="settings" class="w-5 h-5"></i> Configurações
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="document.documentElement.classList.toggle('dark')" class="w-full flex items-center gap-3 p-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white">
                    <i data-lucide="moon" class="w-5 h-5"></i> Alternar Tema
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 h-16 flex items-center justify-between px-8">
                <h2 id="pageTitle" class="text-lg font-semibold capitalize">Dashboard</h2>
                <div class="w-8 h-8 rounded-full bg-primary/20 border-2 border-primary"></div>
            </header>

            <div id="content" class="flex-1 overflow-auto p-8">
            </div>
        </main>
    </div>

    <script>
        const wlcDb = {
            data: JSON.parse(localStorage.getItem('wlc_db') || '{"produtos": [], "vendas": [], "profile": {"name": "Minha Empresa", "email": "contato@empresa.com"}}'),
            save: () => localStorage.setItem('wlc_db', JSON.stringify(wlcDb.data)),
            collection: (name) => ({
                list: () => [...wlcDb.data[name]],
                create: (item) => {
                    const entry = { ...item, id: Date.now(), createdAt: new Date().toISOString() };
                    wlcDb.data[name].push(entry);
                    wlcDb.save();
                    return entry;
                }
            })
        };

        const App = {
            state: { cart: [] },
            notify: (msg) => {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.classList.remove('hidden');
                setTimeout(() => t.classList.add('show'), 10);
                setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.classList.add('hidden'), 300); }, 2000);
            },
            router: {
                push: (page) => {
                    document.getElementById('pageTitle').innerText = page.replace('-', ' ');
                    document.getElementById('content').innerHTML = App.render[page] ? App.render[page]() : '<p>Página não encontrada.</p>';
                    lucide.createIcons();
                }
            },
            render: {
                dashboard: () => {
                    const sales = wlcDb.data.vendas;
                    const rev = sales.reduce((s, v) => s + v.total, 0);
                    return `
                        <div class="flex justify-between items-end mb-8">
                            <div><h1 class="text-2xl font-bold">Dashboard</h1><p class="text-slate-500">Gestão de ${wlcDb.data.profile.name}</p></div>
                            <button onclick="App.actions.exportSales()" class="flex items-center gap-2 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition"><i data-lucide="download" class="w-4 h-4"></i> CSV</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border dark:border-slate-800 shadow-sm">
                                <p class="text-slate-500 text-sm">Produtos</p><p class="text-3xl font-bold mt-1">${wlcDb.data.produtos.length}</p>
                            </div>
                            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border dark:border-slate-800 shadow-sm">
                                <p class="text-slate-500 text-sm">Vendas</p><p class="text-3xl font-bold mt-1">${sales.length}</p>
                            </div>
                            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border dark:border-slate-800 shadow-sm">
                                <p class="text-slate-500 text-sm">Faturamento</p><p class="text-3xl font-bold mt-1 text-primary">R$ ${rev.toFixed(2)}</p>
                            </div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 rounded-2xl border dark:border-slate-800 shadow-sm p-6">
                            <h3 class="font-bold text-lg mb-4">Histórico Recente</h3>
                            <div class="space-y-4">
                                ${sales.length === 0 ? '<p class="text-center py-8 text-slate-500">Nenhuma venda realizada.</p>' : sales.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(v => `
                                    <div class="flex justify-between items-center py-2 border-b dark:border-slate-800">
                                        <div><p class="font-bold">R$ ${v.total.toFixed(2)}</p><p class="text-xs text-slate-500">${new Date(v.createdAt).toLocaleString()}</p></div>
                                        <span class="text-xs bg-primary/10 text-primary px-2 py-1 rounded">${v.items.length} itens</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                },
                products: () => `
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border dark:border-slate-800 shadow-sm p-6">
                        <div class="flex justify-between mb-6">
                            <h3 class="font-bold text-lg">Catálogo</h3>
                            <div class="flex gap-2">
                                <input id="prodName" placeholder="Nome" class="border dark:border-slate-700 rounded-lg px-3 py-2 text-sm bg-slate-50 dark:bg-slate-800 outline-none">
                                <input id="prodPrice" type="number" placeholder="R$" class="border dark:border-slate-700 rounded-lg px-3 py-2 text-sm w-20 bg-slate-50 dark:bg-slate-800 outline-none">
                                <button onclick="App.actions.addProduct()" class="bg-slate-900 dark:bg-primary dark:text-slate-900 text-white px-4 py-2 rounded-lg text-sm font-bold">Add</button>
                            </div>
                        </div>
                        <div class="space-y-2">
                            ${wlcDb.data.produtos.map(p => `<div class="flex justify-between items-center p-3 border dark:border-slate-800 rounded-lg"><span>${p.name}</span><span class="font-bold text-primary">R$ ${p.price.toFixed(2)}</span></div>`).join('')}
                        </div>
                    </div>
                `,
                pos: () => `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 grid grid-cols-3 gap-3">
                            ${wlcDb.data.produtos.map(p => `<button onclick="App.actions.addToCart(${p.id})" class="p-6 rounded-2xl border dark:border-slate-800 hover:border-primary transition">
                                <p class="font-bold">${p.name}</p><p class="text-primary font-bold">R$ ${p.price.toFixed(2)}</p>
                            </button>`).join('')}
                        </div>
                        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border dark:border-slate-800 shadow-sm">
                            <h3 class="font-bold mb-4">Checkout</h3>
                            <div class="space-y-2 mb-4">
                                ${App.state.cart.map(i => `<div class="flex justify-between text-sm">${i.name} <b>R$ ${i.price.toFixed(2)}</b></div>`).join('')}
                            </div>
                            <button onclick="App.actions.checkout()" class="w-full bg-primary text-slate-900 font-bold py-3 rounded-xl hover:opacity-90">Finalizar (R$ ${App.state.cart.reduce((s,i)=>s+i.price,0).toFixed(2)})</button>
                        </div>
                    </div>
                `,
                settings: () => `
                    <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl border dark:border-slate-800 max-w-sm mx-auto">
                        <h3 class="font-bold mb-6">Configurações de Workspace</h3>
                        <div class="space-y-4">
                            <input id="pName" value="${wlcDb.data.profile.name}" class="w-full border dark:border-slate-700 p-2 rounded-lg bg-slate-50 dark:bg-slate-800">
                            <button onclick="App.actions.saveProfile()" class="w-full bg-primary text-slate-900 font-bold py-2 rounded-lg">Salvar Perfil</button>
                        </div>
                    </div>
                `
            },
            actions: {
                addProduct: () => {
                    const name = document.getElementById('prodName').value.replace(/[^a-zA-Z0-9 ]/g, '');
                    const price = parseFloat(document.getElementById('prodPrice').value);
                    if(name && !isNaN(price)) { wlcDb.collection('produtos').create({name, price}); App.notify('Produto adicionado!'); App.router.push('products'); }
                },
                addToCart: (id) => {
                    const p = wlcDb.data.produtos.find(p => p.id === id);
                    if(p) { App.state.cart.push(p); App.notify('Adicionado ao carrinho'); App.router.push('pos'); }
                },
                checkout: () => {
                    const total = App.state.cart.reduce((s, i) => s + i.price, 0);
                    if(total > 0) { wlcDb.collection('vendas').create({items: App.state.cart, total}); App.state.cart = []; App.notify('Venda concluída!'); App.router.push('dashboard'); }
                },
                exportSales: () => {
                    const csv = 'Data,Itens,Total\n' + wlcDb.data.vendas.map(v => `${v.createdAt},${v.items.length},${v.total}`).join('\n');
                    const a = document.createElement('a'); a.href = 'data:text/csv,' + encodeURIComponent(csv); a.download = 'vendas.csv'; a.click();
                },
                saveProfile: () => {
                    wlcDb.data.profile.name = document.getElementById('pName').value.replace(/[^a-zA-Z0-9 ]/g, '');
                    wlcDb.save(); App.notify('Perfil atualizado!'); App.router.push('settings');
                }
            }
        };

        App.router.push('dashboard');
    </script>
</body>
</html>
