<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLC SaaS Control | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: { 600: '#4f46e5' },
                        slate: { 900: '#0f172a', 800: '#1e293b', 100: '#f1f5f9' },
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white p-6 flex flex-col hidden md:flex">
            <div class="flex items-center gap-2 mb-10">
                <i data-lucide="shield-check" class="w-8 h-8 text-indigo-400"></i>
                <span class="text-xl font-bold tracking-tight text-white">WLC SaaS</span>
            </div>
            <nav class="flex-1 space-y-2">
                <button onclick="App.router.push('dashboard')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-all text-slate-300 hover:text-white">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </button>
                <button onclick="App.router.push('products')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-all text-slate-300 hover:text-white">
                    <i data-lucide="box" class="w-5 h-5"></i> Produtos
                </button>
                <button onclick="App.router.push('pos')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-all text-slate-300 hover:text-white">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i> PDV Pro
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden">
            <!-- Topbar -->
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8">
                <h2 id="pageTitle" class="text-lg font-semibold capitalize">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">Assinatura Premium</button>
                    <div class="w-8 h-8 rounded-full bg-slate-200 border border-slate-300"></div>
                </div>
            </header>

            <!-- Scrollable Content -->
            <div id="content" class="flex-1 overflow-auto p-8">
                <!-- Conteúdo Injetado via App.render -->
            </div>
        </main>
    </div>

    <script>
        const wlcDb = {
            data: JSON.parse(localStorage.getItem('wlc_db') || '{}'),
            collection: (name) => {
                if (!wlcDb.data[name]) wlcDb.data[name] = [];
                return {
                    list: () => [...wlcDb.data[name]],
                    create: (item) => {
                        const entry = { ...item, id: Date.now(), createdAt: new Date().toISOString() };
                        wlcDb.data[name].push(entry);
                        localStorage.setItem('wlc_db', JSON.stringify(wlcDb.data));
                        return entry;
                    }
                };
            }
        };

        const ProductService = {
            list: () => wlcDb.collection('produtos').list(),
            create: (name, price) => wlcDb.collection('produtos').create({ name, price: parseFloat(price) })
        };

        const App = {
            router: {
                push: (page) => {
                    const content = document.getElementById('content');
                    document.getElementById('pageTitle').innerText = page.replace('-', ' ');
                    content.innerHTML = App.render[page] ? App.render[page]() : '<p>Página não encontrada.</p>';
                    lucide.createIcons();
                }
            },
            render: {
                dashboard: () => `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-slate-500 text-sm">Total de Produtos</p>
                            <p class="text-3xl font-bold mt-2">${ProductService.list().length}</p>
                        </div>
                    </div>
                `,
                products: () => `
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-bold text-lg">Catálogo de Produtos</h3>
                            <div class="flex gap-2">
                                <input id="prodName" placeholder="Nome" class="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <input id="prodPrice" type="number" placeholder="R$" class="border border-slate-200 rounded-lg px-3 py-2 text-sm w-24 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <button onclick="App.actions.addProduct()" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-800">Adicionar</button>
                            </div>
                        </div>
                        <div class="border-t border-slate-100">
                            ${ProductService.list().length === 0 
                                ? '<div class="py-16 text-center text-slate-400">Nenhum produto cadastrado até o momento.</div>' 
                                : ProductService.list().map(p => `
                                    <div class="flex justify-between items-center py-4 border-b border-slate-100 hover:bg-slate-50 px-2 transition-colors">
                                        <div class="font-medium text-slate-800">${p.name}</div>
                                        <div class="text-indigo-600 font-semibold font-mono text-sm bg-indigo-50 px-3 py-1 rounded-full">R$ ${p.price.toFixed(2)}</div>
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                `,
                pos: () => '<div class="text-center py-20 text-slate-500 italic">Módulo de PDV em processo de implementação de alta latência.</div>'
            },
            actions: {
                addProduct: () => {
                    const name = document.getElementById('prodName').value;
                    const price = document.getElementById('prodPrice').value;
                    if(name && price) {
                        ProductService.create(name, price);
                        App.router.push('products');
                    }
                }
            }
        };

        // Init
        App.router.push('dashboard');
    </script>
</body>
</html>
