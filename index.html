<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLC SaaS | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00FFCC',
                        slate: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 100: '#f1f5f9' },
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-6 flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center">
                    <i data-lucide="zap" class="w-5 h-5 text-slate-900"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">WLC SaaS</span>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-1">
                <button onclick="App.router.push('dashboard')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </button>
                <button onclick="App.router.push('products')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                    <i data-lucide="package" class="w-5 h-5"></i> Produtos
                </button>
                <button onclick="App.router.push('pos')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i> PDV Pro
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <div class="bg-slate-800 p-4 rounded-xl text-center">
                    <p class="text-xs text-slate-400 mb-2">Plano Pro ativo</p>
                    <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-primary w-3/4 h-full"></div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8">
                <h2 id="pageTitle" class="text-lg font-semibold capitalize text-slate-900">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <button class="bg-primary text-slate-900 px-4 py-2 rounded-lg text-sm font-bold hover:opacity-90 transition">Upgrade</button>
                    <div class="w-8 h-8 rounded-full bg-slate-200 border-2 border-slate-300"></div>
                </div>
            </header>

            <div id="content" class="flex-1 overflow-auto p-8">
            </div>
        </main>
    </div>

    <script>
        const wlcDb = {
            data: JSON.parse(localStorage.getItem('wlc_db') || '{"produtos": []}'),
            save: () => localStorage.setItem('wlc_db', JSON.stringify(wlcDb.data)),
            collection: (name) => ({
                list: () => [...wlcDb.data[name]],
                create: (item) => {
                    const entry = { ...item, id: Date.now(), createdAt: new Date().toISOString() };
                    wlcDb.data[name].push(entry);
                    wlcDb.save();
                    return entry;
                }
            })
        };

        const ProductService = {
            list: () => wlcDb.collection('produtos').list(),
            create: (name, price) => wlcDb.collection('produtos').create({ name, price: parseFloat(price) })
        };

        const App = {
            router: {
                push: (page) => {
                    document.getElementById('pageTitle').innerText = page.replace('-', ' ');
                    document.getElementById('content').innerHTML = App.render[page] ? App.render[page]() : '<p>Página não encontrada.</p>';
                    lucide.createIcons();
                }
            },
            render: {
                dashboard: () => `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-slate-500 text-sm">Total Produtos</p>
                            <p class="text-3xl font-bold mt-1">${ProductService.list().length}</p>
                        </div>
                    </div>
                `,
                products: () => \`
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                            <h3 class="font-bold text-lg">Catálogo</h3>
                            <div class="flex gap-2">
                                <input id="prodName" placeholder="Nome" class="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none">
                                <input id="prodPrice" type="number" placeholder="R$" class="border border-slate-200 rounded-lg px-3 py-2 text-sm w-24 focus:border-primary outline-none">
                                <button onclick="App.actions.addProduct()" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-800">Add</button>
                            </div>
                        </div>
                        ${ProductService.list().length === 0 ? 
                            '<div class="p-16 text-center text-slate-400">Nenhum produto.</div>' : 
                            ProductService.list().map(p => \`
                                <div class="flex justify-between items-center py-4 px-6 border-b border-slate-50 last:border-0 hover:bg-slate-50">
                                    <span class="font-medium">${p.name}</span>
                                    <span class="text-primary font-bold text-sm bg-primary/10 px-3 py-1 rounded-full">R$ ${p.price.toFixed(2)}</span>
                                </div>
                            \`).join('')}
                    </div>
                \`,
                pos: () => '<div class="text-center p-20 text-slate-400">Módulo PDV em desenvolvimento.</div>'
            },
            actions: {
                addProduct: () => {
                    const name = document.getElementById('prodName').value;
                    const price = document.getElementById('prodPrice').value;
                    if(name && price) {
                        ProductService.create(name, price);
                        App.router.push('products');
                    }
                }
            }
        };

        App.router.push('dashboard');
    </script>
</body>
</html>
